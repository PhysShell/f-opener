[package]
name        = "fopener-cli"
description = "Command-line interface for F-Opener: watch, validate-config, test-rule, open-once."
keywords    = ["cli", "f-opener", "file-watcher"]
categories  = ["command-line-utilities"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true

[[bin]]
name = "fopener"
path = "src/main.rs"

[dependencies]
fopener-core = { path = "../fopener-core" }
fopener-config = { path = "../fopener-config" }
fopener-watcher = { path = "../fopener-watcher" }
fopener-actions = { path = "../fopener-actions" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
