[package]
name        = "fopener-gui-fltk"
description = "FLTK-based desktop GUI for F-Opener: rules table, edit dialog, log panel."
keywords    = ["gui", "fltk", "f-opener"]
categories  = ["gui"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true

[[bin]]
name = "fopener-gui"
path = "src/main.rs"

[dependencies]
fopener-core = { path = "../fopener-core" }
fopener-config = { path = "../fopener-config" }
fopener-watcher = { path = "../fopener-watcher" }
fopener-actions = { path = "../fopener-actions" }
fltk = { version = "1", features = ["fltk-bundled"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = "0.4"
regex = { workspace = true }

[lints]
workspace = true
